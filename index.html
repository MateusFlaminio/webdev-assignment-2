<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Mateus Flamínio · Portfolio</title>

		<link rel="stylesheet" href="css/variables.css">
		<link rel="stylesheet" href="css/base.css">
		<link rel="stylesheet" href="css/layout.css">
		<link rel="stylesheet" href="css/nav.css">

		<script src="js/theme.js" defer></script>
		<script src="js/clock.js" defer></script>
		<script src="js/nav.js" defer></script>
	</head>

	<body>
		<div class="site">
			<header class="navbar">
				<div class="container navbar-inner">
					<a class="brand" href="#home">
						<span class="brand-orb">
							<img src="assets/placeholder.webp" alt="placeholder">
						</span>
						<span class="brand-text">
							<b>MATEUS FLAMÍNIO</b>
							<small>COMPUTER ENGINEERING STUDENT</small>
						</span>
					</a>

					<nav class="nav-links" id="site-nav" aria-label="Sections">
						<a href="#home">Home</a>
						<a href="#about">About</a>
						<a href="#projects">Projects</a>
						<a href="#skills">Skills</a>
						<a href="#contact">Contact</a>
					</nav>

					<div class="nav-actions">
						<span class="nav-clock monospace" id="clock">--:--</span>

						<div class="theme-container">
							<button class="round-button theme-button" type="button" title="Theme" aria-label="Theme" aria-expanded="false" aria-controls="theme-menu">
								<span class="icon" aria-hidden="true"></span>
							</button>

							<div class="theme-menu hidden" id="theme-menu">
								<button type="button" data-theme="system" aria-pressed="false">System</button>
								<button type="button" data-theme="light" aria-pressed="false">Light</button>
								<button type="button" data-theme="dark" aria-pressed="false">Dark</button>
							</div>
						</div>

						<button class="round-button menu-button" type="button" title="Menu" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
							<span class="icon" aria-hidden="true"></span>
						</button>
					</div>
				</div>
			</header>

			<main id="main">
				<section class="section container" id="home">
					<span class="kicker">Computer Engineering Student</span>
					<h1>Mateus Flamínio</h1>
					<p>Currently pursuing a Master's degree focused on AI/ML at the University of Coimbra.</p>
				</section>
			</main>
		</div>
	</body>
</html>
